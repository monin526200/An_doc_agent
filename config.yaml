# =============================================================================
# MOFL 项目统一配置文件
# 所有环境变量配置已迁移至此文件
# =============================================================================

# -----------------------------------------------------------------------------
# 1. 服务端口配置
# -----------------------------------------------------------------------------
ports:
  # 后端 API 服务端口 (server.py)
  api: 8080
  
  # 前端 UI 服务端口 (ui/app.py - chainlit)
  ui: 7860
  
  # MCP 服务端口 (mcp_tool/mcp_server.py)
  mcp: 8000
  
  # Redis 本地服务端口 (history_redis/run_local_redis.py)
  redis_local: 6380

# -----------------------------------------------------------------------------
# 2. 服务地址配置
# -----------------------------------------------------------------------------
endpoints:
  # MCP arXiv 服务完整 URL
  # 默认自动生成: http://127.0.0.1:{ports.mcp}/arxiv/mcp
  mcp_arxiv_url: ""
  
  # 后端 API 基础 URL (前端连接用)
  # 默认自动生成: http://127.0.0.1:{ports.api}
  api_base_url: ""

# -----------------------------------------------------------------------------
# 3. MCP 服务配置
# -----------------------------------------------------------------------------
mcp:
  # MCP 服务绑定主机
  host: "0.0.0.0"

# -----------------------------------------------------------------------------
# 4. Redis 配置
# -----------------------------------------------------------------------------
redis:
  # Redis 连接方式选择:
  # - "url": 使用完整的 redis_url 连接（适用于远程或认证场景）
  # - "params": 使用 host/port/db 等参数连接（适用于本地开发）
  connection_mode: "params"
  
  # 模式1: 完整 URL (当 connection_mode 为 "url" 时使用)
  # 格式: redis://[username:password@]host:port/db
  url: "redis://127.0.0.1:6380/0"
  
  # 模式2: 连接参数 (当 connection_mode 为 "params" 时使用)
  host: "127.0.0.1"
  port: 6380
  db: 0
  username: ""      # 可选，无认证时留空
  password: ""      # 可选，无认证时留空
  
  # 本地 Redis 服务器额外配置 (run_local_redis.py 使用)
  local_bind: "127.0.0.1"           # 绑定地址
  local_data_dir: ""                # 数据目录，留空使用默认
  server_bin: ""                    # redis-server 可执行文件路径
  
  # 会话存储配置
  session_ttl: 604800               # 会话过期时间（秒），默认7天
  max_summary_chars: 12000           # 长期摘要最大字符数

# -----------------------------------------------------------------------------
# 5. CORS 配置 (server.py)
# -----------------------------------------------------------------------------
cors:
  # 允许的源，多个用逗号分隔
  # 示例: "http://localhost:3000,http://127.0.0.1:5500"
  allow_origins: "*"

# -----------------------------------------------------------------------------
# 6. 目录配置
# -----------------------------------------------------------------------------
paths:
  # 源文件上传目录 (相对于项目根目录或绝对路径)
  source_file: "rag/data/source_file"
  
  # MCP 下载文件保存目录
  mcp_downloads: "mcp_downloads"

# -----------------------------------------------------------------------------
# 7. HTTP 超时配置 (ui/app.py)
# -----------------------------------------------------------------------------
timeouts:
  # 工作流调用超时（秒）
  workflow: 300
  
  # 文档入库超时（秒），大文件需要较长时间
  ingest: 3600
  
  # 文件上传超时（秒）
  upload: 600

# -----------------------------------------------------------------------------
# 8. LLM (大模型) 配置
# -----------------------------------------------------------------------------
# 支持两种模式:
# - "api": 使用云端API (OpenAI兼容接口)
# - "local": 使用本地模型 (vLLM)
#
# 示例 (API模式):
#   llm:
#     mode: api
#     api:
#       base_url: "https://api.openai.com/v1"
#       key: "sk-your-api-key"
#       model: "gpt-3.5-turbo"
#
# 示例 (本地模式):
#   llm:
#     mode: local
#     local:
#       path: "./models/llama-2-7b"
# -----------------------------------------------------------------------------
llm:
  mode: api  # 可选: api | local

  # API 模式配置
  api:
    base_url: ""           # API 基础地址，如 https://api.openai.com/v1
    key: ""               # API 密钥，如 sk-...
    model: ""             # 模型名称，如 gpt-3.5-turbo, gpt-4

  # 本地模式配置
  local:
    path: ""              # 本地模型目录路径 (相对或绝对路径)

# -----------------------------------------------------------------------------
# 9. 运行时配置
# -----------------------------------------------------------------------------
runtime:
  # 默认聊天会话ID (仅用于CLI模式，留空自动生成)
  chat_thread_id: ""
